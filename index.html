<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fetch the main theme while the menu paints; decoding still waits for
         the first user gesture because of browser autoplay policies. -->
    <link
      rel="preload"
      href="%BASE_URL%audio/music/menu-adventure.mp3"
      as="audio"
      type="audio/mpeg"
    />
    <!-- Earth's textures start downloading with the page, so the menu
         shows the textured planet right away (PlanetGlobe.tsx). -->
    <link rel="preload" href="%BASE_URL%textures/earth/earth-day.jpg" as="image" crossorigin="anonymous" />
    <link rel="preload" href="%BASE_URL%textures/earth/earth-clouds.jpg" as="image" crossorigin="anonymous" />
    <link rel="preload" href="%BASE_URL%textures/earth/earth-night.jpg" as="image" crossorigin="anonymous" />
    <link rel="preload" href="%BASE_URL%textures/earth/earth-roughness.jpg" as="image" crossorigin="anonymous" />
    <link rel="preload" href="%BASE_URL%textures/earth/earth-bump.jpg" as="image" crossorigin="anonymous" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#241634" />
    <meta
      name="description"
      content="Cosmic Mail: The Memories That Must Find Their Way Home. A cozy 3D exploration game about restoring the stories of NASA's historic explorers."
    />
    <title>Cosmic Mail — The Memories That Must Find Their Way Home</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
